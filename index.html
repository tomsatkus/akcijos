<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akcijos</title>
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Akcijos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --text:#14171c; --muted:#5d6470; --line:#e3e6ea;
    --accent:#e0352b; --accent-soft:#fde9e7; --good:#0f9d58; --warn:#b45309; --warn-soft:#fff4e0;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
    --radius:18px;
    --c-maxima:#d7262e; --c-iki:#e5007e; --c-lidl:#0b4ea2; --c-rimi:#9e1b45; --c-norfa:#e8a000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --surface:#181b21; --surface-2:#22262e; --text:#eef1f5; --muted:#98a1ae; --line:#2a2f38;
      --accent:#ff5b4f; --accent-soft:#3a1d1b; --good:#34c37a; --warn:#f0a43a; --warn-soft:#33260f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      --c-lidl:#4d8be0; --c-rimi:#d65a7c;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing:antialiased; min-height:100dvh; }
  button { font:inherit; color:inherit; }

  /* ---------- Viršus ---------- */
  .wrap { max-width:760px; margin:0 auto; }
  /* logotipo eilutė nėra „lipni“: slenkant ji nuslenka, viršuje lieka tik paieška ir parduotuvės */
  .brand { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 14px) 18px 4px; }
  .logo { width:32px; height:32px; border-radius:10px; flex-shrink:0;
          background:linear-gradient(135deg, #ff6a4d, #e0352b); display:grid; place-items:center;
          color:#fff; font-weight:800; font-size:16px; box-shadow:0 4px 12px rgba(224,53,43,.35); }
  .brand .sub { margin-left:auto; color:var(--muted); font-size:13px; }
  .brand .sub.offline { color:var(--warn); font-weight:700; }
  .brand h1 { font-size:22px; letter-spacing:-.02em; margin:0; font-weight:800; }
  header {
    position:sticky; top:0; z-index:10; padding:10px 16px 8px;
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:saturate(1.6) blur(16px); -webkit-backdrop-filter:saturate(1.6) blur(16px);
    transition:box-shadow .2s;
  }
  header.stuck { padding-top:calc(env(safe-area-inset-top) + 8px); box-shadow:0 1px 0 var(--line); }

  .searchrow { display:flex; gap:8px; }
  .search { position:relative; flex:1; min-width:0; }
  .search svg { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  #q {
    width:100%; height:50px; padding:0 46px 0 46px; font-size:17px;
    border:1px solid var(--line); border-radius:15px; background:var(--surface); color:var(--text);
    box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; appearance:none;
  }
  #q::placeholder { color:var(--muted); }
  #q:focus { outline:none; border-color:var(--muted); box-shadow:0 0 0 4px color-mix(in srgb, var(--text) 12%, transparent); }
  #q::-webkit-search-cancel-button { display:none; }
  #clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:38px; height:38px;
           border:0; border-radius:12px; background:transparent; color:var(--muted); cursor:pointer; display:none; }
  #clear:hover { background:var(--surface-2); }
  .has-text #clear { display:grid; place-items:center; }
  .iconbtn { position:relative; width:50px; height:50px; flex-shrink:0; border:1px solid var(--line); border-radius:15px;
             background:var(--surface); box-shadow:var(--shadow); display:grid; place-items:center; cursor:pointer; color:var(--text); }
  .iconbtn:active { transform:scale(.96); }
  .dotbadge { position:absolute; top:9px; right:9px; width:9px; height:9px; border-radius:50%; background:var(--text);
              box-shadow:0 0 0 2px var(--surface); }

  /* parduotuvių juosta: kraštas blunka, kai yra ką slinkti */
  .chips-wrap { --fl:0px; --fr:0px; margin:0 -16px;
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
            mask-image:linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%); }
  .chips-wrap.more-left { --fl:28px; } .chips-wrap.more-right { --fr:44px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:10px 16px 2px; scrollbar-width:none; scroll-padding:0 16px; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex-shrink:0; display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px;
    border:1px solid var(--line); border-radius:999px; background:var(--surface); cursor:pointer;
    font-size:14px; font-weight:600; color:var(--text); transition:background .15s, border-color .15s, color .15s;
  }
  .chip .dot { width:8px; height:8px; border-radius:50%; background:var(--c); }
  .chip[aria-pressed="true"] { background:var(--text); border-color:var(--text); color:var(--bg); }
  .chip[aria-pressed="true"] .dot { box-shadow:0 0 0 2px var(--bg); }
  .chip .n { font-weight:500; opacity:.6; font-variant-numeric:tabular-nums; }

  main { padding:4px 16px calc(env(safe-area-inset-bottom) + 40px); }
  #status { color:var(--muted); font-size:13px; margin:6px 4px 10px; min-height:18px; }

  /* ---------- Prisijungimas ---------- */
  [hidden] { display:none !important; }
  body.locked header, body.locked main, body.locked .brand { display:none; }
  .login { min-height:100dvh; display:grid; place-items:center; padding:24px 20px calc(env(safe-area-inset-bottom) + 24px); }
  .login-card { width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .login-card .logo { width:56px; height:56px; border-radius:16px; font-size:26px; margin-bottom:14px; }
  .login-card h2 { margin:0 0 6px; font-size:24px; letter-spacing:-.02em; }
  .login-card p { margin:0 0 22px; color:var(--muted); font-size:14px; }
  #loginFields { width:100%; display:flex; flex-direction:column; gap:10px; }
  #loginFields input { width:100%; height:50px; padding:0 16px; font-size:17px; border:1px solid var(--line); border-radius:14px;
                       background:var(--surface); color:var(--text); box-shadow:var(--shadow); -webkit-appearance:none; appearance:none; }
  #loginFields input:focus { outline:none; border-color:var(--muted); box-shadow:0 0 0 4px color-mix(in srgb, var(--text) 12%, transparent); }
  #loginFields .primary { margin-top:6px; }
  #loginFields .primary:disabled { opacity:.6; }
  .lerr { color:var(--accent); font-size:14px; min-height:20px; }
  .secondary { width:100%; height:46px; margin-top:10px; border:0; border-radius:14px; background:transparent; color:var(--muted);
               font-size:15px; font-weight:600; cursor:pointer; }

  /* ---------- Filtrų lapas ---------- */
  .sheet { border:0; padding:0; margin:auto auto 0; width:100%; max-width:520px; max-height:85dvh;
           border-radius:22px 22px 0 0; background:var(--surface); color:var(--text);
           box-shadow:0 -10px 40px rgba(0,0,0,.2); }
  .sheet[open] { animation:up .25s cubic-bezier(.2,.8,.2,1); }
  .sheet::backdrop { background:rgba(10,12,16,.45); animation:fade .2s; }
  @keyframes up { from { transform:translateY(100%); } }
  @keyframes fade { from { opacity:0; } }
  @media (min-width:700px) { .sheet { margin:auto; border-radius:22px; } .sheet .grab { display:none; } }
  .sheet form { padding:10px 20px calc(env(safe-area-inset-bottom) + 18px); }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px; }
  .sheet h2 { font-size:18px; margin:0 0 16px; }
  .field-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; }
  .seg { display:flex; background:var(--surface-2); border-radius:12px; padding:3px; }
  .seg button { flex:1; border:0; background:transparent; padding:10px 8px; border-radius:9px; font-size:14px; font-weight:600;
                color:var(--muted); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .toggle { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:15px; margin:18px 0 20px;
            padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  .toggle input { appearance:none; -webkit-appearance:none; width:46px; height:28px; border-radius:999px; background:var(--line);
                  position:relative; cursor:pointer; transition:background .2s; margin:0; flex-shrink:0; }
  .toggle input::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
                         background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
  .toggle input:checked { background:var(--text); }
  .toggle input:checked::after { transform:translateX(18px); }
  .primary { width:100%; height:50px; border:0; border-radius:14px; background:var(--text); color:var(--bg);
             font-size:16px; font-weight:700; cursor:pointer; }

  /* ---------- Kortelės ---------- */
  #results { display:grid; gap:8px; }
  @media (min-width:700px) { #results { grid-template-columns:1fr 1fr; } }
  .card {
    position:relative; background:var(--surface); border-radius:16px; box-shadow:var(--shadow);
    padding:11px 14px 12px 17px; display:flex; flex-direction:column; gap:6px; overflow:hidden;
    color:inherit; text-decoration:none; animation:pop .25s ease both; transition:transform .1s;
  }
  .card:active { transform:scale(.985); }
  .card:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c, var(--muted)); }
  .card.expired { opacity:.5; }
  @keyframes pop { from { opacity:0; transform:translateY(6px); } }
  .top { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .store { display:inline-flex; align-items:center; gap:5px; font-weight:700; letter-spacing:.03em;
           text-transform:uppercase; color:var(--c); }
  .store .dot { width:7px; height:7px; border-radius:50%; background:var(--c); }
  .pg-ref { display:inline-flex; align-items:center; gap:3px; }
  .pg-ref::before { content:"·"; margin-right:3px; }
  .when { margin-left:auto; white-space:nowrap; }
  .when.soon { color:var(--warn); font-weight:600; }
  .body { display:flex; gap:12px; align-items:flex-start; }
  .info { flex:1; min-width:0; }
  .name { font-weight:650; font-size:15.5px; line-height:1.3; margin:0 0 3px; overflow-wrap:anywhere;
          display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { color:var(--muted); font-size:13px; line-height:1.4; }
  .cond { display:inline-block; margin-top:5px; font-size:12px; font-weight:600; color:var(--text);
          background:var(--surface-2); padding:2px 7px; border-radius:6px; }
  .price { text-align:right; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .now { font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1; color:var(--text); font-variant-numeric:tabular-nums; }
  .now small { font-size:.6em; font-weight:700; margin-left:1px; }
  .now.pct { color:var(--accent); }
  .was { display:flex; align-items:center; gap:6px; }
  .old { color:var(--muted); text-decoration:line-through; font-size:13px; font-variant-numeric:tabular-nums; }
  .na { color:var(--muted); font-size:12px; }
  .badge { background:var(--accent); color:#fff; font-size:12px; font-weight:800; padding:2px 6px; border-radius:6px;
           font-variant-numeric:tabular-nums; }
  .save { color:var(--good); font-size:12px; font-weight:600; white-space:nowrap; }
  .warn { font-size:12px; color:var(--warn); background:var(--warn-soft); padding:5px 8px; border-radius:8px; }

  /* ---------- Tuščia būsena ---------- */
  .empty { text-align:center; padding:40px 12px 20px; color:var(--muted); }
  .empty .big { font-size:44px; margin-bottom:6px; }
  .empty h2 { color:var(--text); font-size:18px; margin:0 0 6px; }
  .empty p { margin:0 0 18px; font-size:14px; }
  .sugg { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .sugg .chip { font-weight:500; }
  .section-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
                   margin:22px 0 10px; }


  #results.loading { opacity:.55; transition:opacity .15s; }
  .pager { display:flex; justify-content:center; align-items:center; gap:4px; margin:22px 0 4px; flex-wrap:wrap; }
  .pg { min-width:36px; height:40px; padding:0 8px; border:0; border-radius:11px; background:transparent;
        font-size:15px; font-weight:600; color:var(--text); cursor:pointer; font-variant-numeric:tabular-nums;
        display:grid; place-items:center; }
  .pg:hover:not(:disabled) { background:var(--surface-2); }
  .pg[aria-current="page"] { background:var(--text); color:var(--bg); }
  .pg.nav { background:var(--surface); box-shadow:var(--shadow); width:40px; }
  .pg.nav:first-child { margin-right:6px; } .pg.nav:last-child { margin-left:6px; }
  .pg:disabled { opacity:.35; cursor:default; }
  .pager .gap { width:22px; text-align:center; color:var(--muted); }
  .pager .chip.more { height:46px; padding:0 22px; font-size:15px; box-shadow:var(--shadow); }
  .empty > .chip { margin-top:4px; }
  .skel { height:118px; border-radius:var(--radius); background:linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);
          background-size:200% 100%; animation:sh 1.1s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .card, .skel { animation:none; } }

  /* ---------- Apatinė juosta: Akcijos / Krepšelis ---------- */
  main { padding-bottom:calc(env(safe-area-inset-bottom) + 96px); }
  .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; gap:6px;
            padding:6px 12px calc(env(safe-area-inset-bottom) + 6px); border-top:1px solid var(--line);
            background:color-mix(in srgb, var(--surface) 88%, transparent);
            backdrop-filter:saturate(1.6) blur(16px); -webkit-backdrop-filter:saturate(1.6) blur(16px); }
  body.locked .tabbar { display:none; }
  .tab { position:relative; flex:1; max-width:220px; border:0; background:transparent; border-radius:12px; cursor:pointer;
         display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 4px;
         font-size:11.5px; font-weight:650; color:var(--muted); }
  .tab[aria-selected="true"] { color:var(--text); }
  .tab svg { width:56px; height:30px; padding:3px 16px; border-radius:15px; transition:background .15s; box-sizing:border-box; }
  .tab[aria-selected="true"] svg { background:var(--surface-2); }
  .tab .cnt { position:absolute; top:0; left:calc(50% + 9px); min-width:18px; height:18px; padding:0 5px; border-radius:9px;
              background:var(--accent); color:#fff; font-size:11px; font-weight:800; display:grid; place-items:center;
              font-variant-numeric:tabular-nums; box-shadow:0 0 0 2px var(--surface); }
  .tab .cnt.bump { animation:bump .35s ease; }
  @keyframes bump { 50% { transform:scale(1.3); } }
  body.v-basket header { display:none; }

  /* ---------- Kortelė su mygtuku krepšeliui ---------- */
  .cardbox { position:relative; }
  /* mygtukas yra šalia nuorodos (ne jos viduje), o kainos stulpelyje jam paliekama vieta (.slot-space) */
  .card.withslot .body { padding-right:50px; }   /* sąraše krepšelio mygtukas – dešinėje šalia kainos */
  .cardbox > .slot { top:42px; bottom:auto; }
  .slot { position:absolute; right:14px; bottom:12px; width:38px; height:38px; padding:0; border-radius:50%; cursor:pointer;
          display:grid; place-items:center; border:1px solid var(--line); background:var(--surface); color:var(--text);
          transition:background .15s, color .15s, border-color .15s; }
  .slot:active { transform:scale(.92); }
  .slot::after { content:""; position:absolute; inset:-8px; border-radius:50%; }   /* paspaudžiamas plotas ~54 px */
  .slot.on { background:var(--text); border-color:var(--text); color:var(--bg); }
  @media (prefers-color-scheme: dark) {
    .slot.on { background:color-mix(in srgb, var(--text) 20%, var(--surface)); border-color:color-mix(in srgb, var(--text) 35%, var(--surface));
               color:var(--text); }
  }
  .slot.rm { border-color:transparent; background:transparent; color:var(--muted); }

  /* ---------- Krepšelis ---------- */
  .grp .glbl { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text); }
  .rstore { color:var(--c); font-weight:700; }
  .pinx { text-decoration:none; font-size:16px; }
  .bcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .brow { position:relative; display:flex; align-items:center; padding-right:4px; border-top:1px solid var(--line); }
  .brow:first-child { border-top:0; }
  .brow::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c); }
  .brow .wlink { padding-left:2px; }
  .check { width:52px; align-self:stretch; flex-shrink:0; border:0; background:transparent; padding:0; cursor:pointer;
           display:grid; place-items:center; }
  .check i { width:28px; height:28px; border-radius:50%; border:2px solid var(--muted); display:grid; place-items:center;
             color:transparent; transition:background .15s, border-color .15s; }
  .check[aria-checked="true"] i { background:var(--good); border-color:var(--good); color:#fff; }
  .brow.done .wn { text-decoration:line-through; color:var(--muted); }
  .brow.done .wp, .brow.done .badge { opacity:.5; }
  .brow.done::before { opacity:.35; }
  .bcard.done { box-shadow:none; background:transparent; border:1px solid var(--line); }
  .donebtn { display:flex; justify-content:space-between; width:100%; margin:22px 0 8px; padding:6px 2px; border:0;
             background:transparent; font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
             color:var(--muted); cursor:pointer; }
  .gone { font-size:12px; font-weight:700; color:var(--warn); white-space:nowrap; }
  .wsub .soon { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; }
  .toast { position:fixed; z-index:30; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 76px); max-width:480px;
           margin:0 auto; display:flex; align-items:center; gap:12px; padding:10px 8px 10px 16px; border-radius:14px;
           background:var(--text); color:var(--bg); font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .toast.in { animation:tin .2s ease; }
  @keyframes tin { from { opacity:0; transform:translateY(8px); } }
  .toast .tmsg { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toast button { flex-shrink:0; border:0; background:transparent; color:inherit; font-weight:800; font-size:14px;
                  padding:8px 10px; border-radius:10px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .sum { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin:6px 0 4px; }
  .sum .row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .sum .total { font-size:28px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .sum .lbl { color:var(--muted); font-size:13px; }
  .bar { height:6px; border-radius:3px; background:var(--surface-2); margin:12px 0 6px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--good); border-radius:3px; transition:width .3s; }
  .grp { display:flex; align-items:center; gap:8px; margin:20px 2px 8px; font-size:13px; color:var(--muted); }
  .grp .store { font-size:13px; }
  .grp .gsum { margin-left:auto; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
  .blist { display:grid; gap:8px; }
  @media (min-width:700px) { .blist { grid-template-columns:1fr 1fr; } }
  .sum .wake { color:var(--good); font-weight:600; }
  .bactions { display:flex; gap:8px; justify-content:center; margin:22px 0 0; flex-wrap:wrap; }

  /* ---------- Stebimos prekės ---------- */
  body.v-watch header { display:none; }
  #status { display:flex; align-items:center; gap:8px; }
  .wbtn { margin-left:auto; border:0; background:transparent; color:var(--text); font-size:13px; font-weight:700;
          padding:6px 2px; cursor:pointer; white-space:nowrap; }

  .wg { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; animation:pop .25s ease both; }

  .wnone { padding:0 14px 12px; margin-top:-6px; font-size:13px; color:var(--muted); }

  /* ---------- Kur apsipirkti ---------- */
  .rec { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px 12px; margin:0 0 12px;
         border:1.5px solid color-mix(in srgb, var(--c) 45%, transparent); }

               background:transparent; padding:10px 4px; margin:-6px 0; cursor:pointer; }

</head>
<body>
<div class="wrap brand">
  <div class="logo">%</div>
  <h1>Akcijos</h1>
  <span class="sub" id="updated"></span>
</div>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" aria-label="Ieškoti prekės" inputmode="search" enterkeyhint="search" placeholder="Ieškoti prekės…" autocomplete="off" autocapitalize="off" spellcheck="false">

<script>
const $ = id => document.getElementById(id);
const q = $('q'), allBox = $('all'), statusEl = $('status'), resultsEl = $('results'), pagerEl = $('pager');
const CHAINS = { maxima:'Maxima', iki:'IKI', lidl:'Lidl', rimi:'Rimi', norfa:'Norfa' };

// Būsena laikoma ir adreso juostoje (?q=...&chain=...&sort=...&page=...), kad atnaujinus puslapį ar
// grįžus atgal matytumėte tą patį sąrašą
const params = new URLSearchParams(location.search);
const state = {
  q: params.get('q') || '',
  chain: CHAINS[params.get('chain')] ? params.get('chain') : null,
  sort: ['discount', 'price'].includes(params.get('sort')) ? params.get('sort') : null,   // null – automatiškai (sortMode)
  page: Math.max(1, parseInt(params.get('page')) || 1),
  all: params.get('all') === '1',
  view: { krepselis: 'basket', stebimos: 'watch' }[params.get('view')] || 'list',
};
let timer, lastCounts = null;
const PER_PAGE = 24;   // dalijasi iš 2 ir 3: lygios eilės telefone ir kompiuteryje

/* ---------- Paieška (tokia pati kaip common.py / server.py) ----------
   data.json: visos akcijos, jau surikiuotos pigiausios pirmos, be pasikartojimų.
   Laukai: c tinklas, n pavadinimas, q kiekis, p kaina, o sena kaina, d nuolaida %, u kaina už vnt., k sąlygos,
   pg puslapis, f/t galioja nuo/iki, r patikrinti, s paieškos tekstas, l leidinio nuoroda. */
let DATA = null;
// lietuviškos galūnės be diakritikų, ilgiausios pirmos (common.py _ENDINGS)
const ENDINGS = [...new Set(("iuose uose ose ese yse iams ioms ams oms ems ims iais ais omis emis imis umis mis " +
  "ioje oje eje uje iai iui iu ius ies ios iam iom as is ys us os es ai ei ui am om em uo ens io ia a e o u i y s")
  .split(' '))].sort((a, b) => b.length - a.length);
const normalize = t => t.toLowerCase().normalize('NFKD').replace(/\p{M}/gu, '').replace(/[^a-z0-9]+/g, ' ').trim();
function stem(t) {
  if (/^\d+$/.test(t) || t.length <= 3) return t;
  for (const e of ENDINGS) if (t.endsWith(e) && t.length - e.length >= 3) return t.slice(0, -e.length);
  return t;
}

/* ---------- Prisijungimas: data.json užšifruotas (web/export_static.py, web/vartotojai.py) ----------
   Vartotojo slaptažodis -> PBKDF2 raktas -> atrakina duomenų raktą -> AES-GCM -> gzip -> JSON.
   Raktas įsimenamas IndexedDB kaip neeksportuojamas CryptoKey: kitą kartą slaptažodžio nereikia. */
let ENCRYPTED = false;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function userHash(name) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('akcijos:' + name.trim().toLowerCase().normalize('NFC')));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
}
async function deriveKek(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base,
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function openEnvelope(env, kek, h) {
  const u = env.users.find(x => x.h === h);
  if (!u) throw new Error('vartotojo nėra');
  const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(u.iv) }, kek, b64(u.wk));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, key, b64(env.ct));
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
const kv = {
  db: () => new Promise((ok, no) => {
    const r = indexedDB.open('akcijos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }),
  async get(k) {
    try { const db = await kv.db(); return await new Promise(ok => {
      const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); });
    } catch { return undefined; }
  },
  async put(k, v) {
    try { const db = await kv.db(); await new Promise(ok => {
      const t = db.transaction('kv', 'readwrite'); v === undefined ? t.objectStore('kv').delete(k) : t.objectStore('kv').put(v, k);
      t.oncomplete = ok; t.onerror = ok; });
    } catch {}
  },
};
function showLogin(msg, closed = false) {
  document.body.classList.add('locked');
  $('login').hidden = false;
  $('loginMsg').textContent = msg || 'Akcijų sąrašas prieinamas tik pakviestiems vartotojams.';
  $('loginFields').hidden = closed;
  if (!closed) setTimeout(() => ($('lname').value ? $('lpass') : $('lname')).focus(), 50);
}
function hideLogin() {
  document.body.classList.remove('locked');
  $('login').hidden = true;
}
async function unlock(env) {
  ENCRYPTED = true;
  $('logoutBtn').hidden = false;
  if (!env.users || !env.users.length) {
    showLogin('Prieiga dar nesukurta. Kompiuteryje paleiskite: python web\\vartotojai.py prideti VARDAS', true);
    return new Promise(() => {});
  }
  const saved = await kv.get('login');
  if (saved) {
    try { return await openEnvelope(env, saved.kek, saved.h); }
    catch { await kv.put('login'); return askLogin(env, 'Prieiga pasikeitė – prisijunkite iš naujo.'); }
  }
  return askLogin(env);
}
function askLogin(env, msg) {
  showLogin(msg);
  return new Promise(resolve => {
    $('loginForm').onsubmit = async e => {
      e.preventDefault();
      const btn = $('lbtn');
      btn.disabled = true; btn.textContent = 'Tikrinama…'; $('lerr').textContent = '';
      try {
        const h = await userHash($('lname').value);
        const u = env.users.find(x => x.h === h);
        if (!u) throw new Error();
        const kek = await deriveKek($('lpass').value, b64(u.salt), u.it);
        const data = await openEnvelope(env, kek, h);
        await kv.put('login', { h, kek });
        $('lpass').value = '';
        hideLogin();
        resolve(data);
      } catch {
        $('lerr').textContent = 'Neteisingas vardas arba slaptažodis.';
      }
      btn.disabled = false; btn.textContent = 'Prisijungti';
    };
  });
}

// „atnaujinta 11.20“, o be ryšio – „be ryšio · duomenys 11.20“ (rodoma paskutinė išsaugota kopija)
function netStatus() {
  const g = (DATA && DATA.generated) || '', d = g ? fmtDate(g.slice(0, 10)) : '';
  const off = navigator.onLine === false;
  $('updated').textContent = off ? (d ? `be ryšio · duomenys ${d}` : 'be ryšio') : (d ? 'atnaujinta ' + d : '');
  $('updated').classList.toggle('offline', off);
}
addEventListener('online', netStatus); addEventListener('offline', netStatus);
async function loadData() {
  const res = await fetch('data.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error(res.status);
  const raw = await res.json();
  DATA = raw.items ? raw : await unlock(raw);   // vietinis serveris – atviras sąrašas, svetainė – užšifruotas
  for (const it of DATA.items) { it.w = it.s.split(' '); it.st = it.w.map(stem); }
  const g = DATA.generated || '';
  netStatus();
}

// ta pati paieška naudojama sąraše ir stebimose prekėse
function matchItems(items, text) {
  const raw = normalize(text).split(' ').filter(Boolean), toks = raw.map(stem);
  if (!toks.length) { for (const it of items) it.x = 0; return items; }
  // žodis tinka, jei jo kamienas sutampa („sūrio" ~ „sūris") arba jis prasideda įvestu tekstu („šokol")
  items = items.filter(it => raw.every((r, i) => it.w.some((w, j) => w.startsWith(r) || it.st[j] === toks[i])));
  // pirmiau prekės, kurių žodžiai atitinka tiksliai („mėsa" ~ „mėsos"), po jų tik pagal pradžią („mėsainis")
  for (const it of items) it.x = toks.every(s => it.st.includes(s)) ? 0 : 1;
  return items;
}

// be paieškos – didžiausios nuolaidos (įdomiausios akcijos), su paieška – pigiausios; kol naudotojas nepasirinko pats
const sortMode = () => state.sort || (state.q.trim() ? 'price' : 'discount');

function browse() {
  const t = today();
  let items = matchItems(DATA.items.filter(it => state.all || !it.t || it.t >= t), state.q);
  // kaip „Stebimose“: pirmiau prekės su tiksliai tuo pačiu žodžiu („kava“), po jų kitos formos („prie kavos“)
  const words = normalize(state.q).split(' ').filter(Boolean);
  for (const it of items) it.y = words.length && !words.every(x => it.w.includes(x)) ? 1 : 0;
  const counts = {};
  for (const it of items) counts[it.c] = (counts[it.c] || 0) + 1;
  if (state.chain) items = items.filter(it => it.c === state.chain);
  items = sortMode() === 'discount'
    ? items.slice().sort((a, b) => a.x - b.x || a.y - b.y || (a.p == null) - (b.p == null) || (b.d ?? -1) - (a.d ?? -1))   // be kainos – po kitų
    : items.slice().sort((a, b) => a.x - b.x || a.y - b.y);   // data.json jau surikiuotas pagal kainą; sort() stabilus
  const total = items.length, pages = Math.max(1, Math.ceil(total / PER_PAGE));
  const page = Math.min(Math.max(1, state.page), pages);
  return { total, page, pages, per_page: PER_PAGE, counts, results: items.slice(0, page * PER_PAGE) };
}

const eur = n => n.toFixed(2).replace('.', ',');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;   // textContent: duomenys nėra interpretuojami kaip HTML
  return e;

const chainColor = c => `var(--c-${c in CHAINS ? c : 'x'}, var(--muted))`;
// 1 prekė, 2–9 prekės, 10–20 ir 30, 40… prekių

  return d === 1 && t !== 11 ? 'prekė' : d >= 2 && (t < 10 || t > 20) ? 'prekės' : 'prekių'; };
// vien didžiosiomis parašytos kategorijų nuolaidos („KNYGOMS“, „SULTIMS, SULČIŲ GĖRIMAMS…“) rodomos įprastu rašymu;
// prekės ženklai (DOBILAS, TIRA, AROMA GOLD) nekeičiami – keičiama tik, jei VISI žodžiai didžiosiomis ir yra naudininko galūnė

function dispName(n) {
  const ws = n.match(/[A-Za-zĄČĘĖĮŠŲŪŽąčęėįšųūž]{2,}/g) || [];
  if (!ws.length || !ws.every(w => w === w.toUpperCase()) || !ws.some(w => DATIVE.test(w))) return n;
  const low = n.toLocaleLowerCase('lt');
  return low.charAt(0).toLocaleUpperCase('lt') + low.slice(1);
}
const fmtDate = iso => iso.slice(5).replace('-', '.');
const daysLeft = iso => Math.round((new Date(iso + 'T00:00') - new Date(today() + 'T00:00')) / 864e5);

/* ---------- Parduotuvių filtras ---------- */
function renderChains(counts) {
  const box = $('chains');
  box.replaceChildren();
  const mk = (key, label, n) => {
    const b = el('button', 'chip');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(state.chain === key));
    if (key) { b.style.setProperty('--c', chainColor(key)); b.append(el('span', 'dot')); }
    b.append(label);
    if (n != null) b.append(el('span', 'n', n));
    b.onclick = () => { state.chain = state.chain === key ? null : key; state.page = 1; load(); };
    box.append(b);
  };
  mk(null, 'Visos', counts ? Object.values(counts).reduce((a, b) => a + b, 0) : null);
  for (const [k, label] of Object.entries(CHAINS)) {
    if (counts && !counts[k] && state.chain !== k) continue;
    mk(k, label, counts ? (counts[k] || 0) : null);
  }
  updateFade();
}
function updateFade() {
  const sc = $('chains'), w = $('chipsWrap');
  w.classList.toggle('more-left', sc.scrollLeft > 2);
  w.classList.toggle('more-right', sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 2);
}

/* ---------- Kortelė (visa kortelė atidaro leidinį) ---------- */
function card(r, slot = false) {
  const t = today();
  const expired = r.t && r.t < t;
  const c = el(r.l ? 'a' : 'article', 'card' + (expired ? ' expired' : ''));
  if (r.l) { c.href = r.l; c.target = '_blank'; c.rel = 'noopener'; }
  c.style.setProperty('--c', chainColor(r.c));
  c.setAttribute('aria-label', `${CHAINS[r.c] || r.c}: ${r.n}` + (r.p != null ? `, ${eur(r.p)} €` : '') +
    (r.l ? `. Atidaryti leidinį, ${r.pg} puslapis` : ''));

  const top = el('div', 'top');
  const s = el('span', 'store'); s.append(el('span', 'dot'), CHAINS[r.c] || r.c);
  top.append(s, el('span', 'pg-ref', 'leidinys, p. ' + r.pg));
  if (r.f && r.f > t) top.append(el('span', 'when', 'nuo ' + fmtDate(r.f)));
  else if (r.t) {
    const d = daysLeft(r.t);
    const txt = d < 0 ? 'baigėsi ' + fmtDate(r.t) : d === 0 ? 'baigiasi šiandien' : d === 1 ? 'baigiasi rytoj' : 'iki ' + fmtDate(r.t);
    top.append(el('span', 'when' + (d >= 0 && d <= 1 ? ' soon' : ''), txt));
  }
  c.append(top);

  const body = el('div', 'body');
  const info = el('div', 'info');
  info.append(el('h3', 'name', dispName(r.n)));
  const meta = [r.q, r.u].filter(Boolean).join(' · ');
  if (meta) info.append(el('div', 'meta', meta));
  if (r.k) info.append(el('span', 'cond', r.k));

  const price = el('div', 'price');
  if (r.p != null) {
    const now = el('div', 'now', eur(r.p)); now.append(el('small', null, ' €'));
    price.append(now);
    if (r.o || r.d) {
      const was = el('div', 'was');
      if (r.o) was.append(el('span', 'old', eur(r.o) + ' €'));
      if (r.d) was.append(el('span', 'badge', '−' + r.d + '%'));
      price.append(was);
    }
  } else {
    price.append(el('div', 'now pct', r.d ? '−' + r.d + '%' : '—'));
    price.append(el('span', 'na', 'kaina nenurodyta'));
  }
  if (slot) c.classList.add('withslot');
  body.append(info, price);
  c.append(body);

  if (r.r) c.append(el('div', 'warn', '⚠ Kaina gali būti nuskaityta neteisingai – patikrinkite leidinyje'));
  return c;
}

/* ---------- Krepšelis: laikomas tik šiame įrenginyje (IndexedDB, raktas 'basket') ----------
   Prekė įsimenama su visais savo duomenimis, todėl lieka krepšelyje ir atėjus kitos savaitės data.json.
   data.json prekės neturi nuolatinio id, todėl jis sudaromas iš tinklo, pavadinimo, kiekio, galiojimo ir puslapio. */
let BASKET = [];   // [{ id, it, done, at }]
const itemId = r => [r.c, r.n, r.q || '', r.f || '', r.pg].join('|');
const snap = ({ w, st, x, s, ...rest }) => rest;
const inBasket = r => BASKET.some(b => b.id === itemId(r));
async function loadBasket() {
  const saved = await kv.get('basket');
  BASKET = Array.isArray(saved) ? saved : [];
  const byId = new Map(DATA.items.map(it => [itemId(it), it]));
  for (const b of BASKET) { const fresh = byId.get(b.id); if (fresh) b.it = snap(fresh); }   // pvz. pataisyta kaina
  updateCount();
}
function saveBasket(bump) { kv.put('basket', BASKET); updateCount(bump); }
function updateCount(bump) {
  const n = BASKET.filter(b => !b.done).length, c = $('basketCount');
  c.hidden = !n; c.textContent = n;
  if (bump) { c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
}
function toggleBasket(r) {
  const i = BASKET.findIndex(b => b.id === itemId(r));
  if (i >= 0) BASKET.splice(i, 1); else BASKET.push({ id: itemId(r), it: snap(r), done: false, at: Date.now() });
  saveBasket(i < 0);
}

// sąrašo kortelė + mygtukas „Į krepšelį“ (mygtukas šalia nuorodos, ne jos viduje)

let doneOpen = false;
// galiojimo žyma eilutėms (krepšelis, stebimos): baigėsi / nuo … / baigiasi šiandien, rytoj
function whenTag(it, quiet) {

/* ---------- Pranešimas „… · Atšaukti“: šalinama iš karto, bet 5 s galima atšaukti ---------- */
let toastTimer;

function renderBasket() {
  const v = $('basketView');
  v.replaceChildren();
  if (!BASKET.length) {
    const box = el('div', 'empty');
    box.append(el('div', 'big', '🛒'), el('h2', null, 'Krepšelis tuščias'),

  row.append(l, r);
  const bar = el('div', 'bar'); const fill = el('i'); fill.style.width = (done.length / n * 100) + '%'; bar.append(fill);
  const wn = el('span', 'wake', ' · ☀ ekranas neužges'); wn.id = 'wakeNote'; wn.hidden = !wakeLock;
  const st = el('div', 'lbl', `${done.length} iš ${n} nupirkta` + (noPrice ? ` · ${noPrice} be kainos (neįskaičiuota)` : '')
    + (nGone ? ` · ${nGone} ${plural(nGone, 'akcija pasibaigė', 'akcijos pasibaigė', 'akcijų pasibaigė')} (neįskaičiuota)` : ''));
  st.append(wn);

  // nenupirktos – pagal parduotuvę (perkant einama iš vienos į kitą); nupirktos – suskleistos apačioje
  const keys = [...Object.keys(CHAINS), ...new Set(BASKET.map(b => b.it.c).filter(c => !(c in CHAINS)))];
  // parduotuvės su keliomis prekėmis – atskira grupė; po vieną prekę – visos vienoje kortelėje, tinklas nurodomas eilutėje
  const singles = keys.filter(c => left.filter(b => b.it.c === c).length === 1);
  const multi = keys.filter(c => left.filter(b => b.it.c === c).length > 1);
  if (singles.length === 1) multi.push(singles.pop());   // viena tokia – įprasta grupė
  for (const c of keys) {
    if (!multi.includes(c)) continue;
    const items = left.filter(b => b.it.c === c).sort((a, b) => a.at - b.at);
    const g = el('div', 'grp');

  clr.onclick = () => {

  };
  act.append(clr);
  v.append(act);
  updateWake();
}

// krepšelio eilutė: didelis žymėjimas kairėje (lengva pataikyti nykščiu), pavadinimas atidaro leidinį, × – pašalinti

/* ---------- Stebimos prekės: žodžiai, pagal kuriuos ieškoma akcijų (IndexedDB, raktas 'watch') ----------
   seen – akcijos, kurias naudotojas jau matė; kitos pažymimos „nauja“. */
let WATCH = [];      // [{ q, at, seen: [id] }]
let NEWNOW = null;   // per šį apsilankymą skiltyje rodomos naujos akcijos: Map(q -> Set(id))
const plural = (n, one, few, many) => { const d = n % 10, t = n % 100;
  return d === 1 && t !== 11 ? one : d >= 2 && (t < 10 || t > 20) ? few : many; };
const akcijos = n => `${n} ${plural(n, 'akcija', 'akcijos', 'akcijų')}`;
const naujos = n => `${n} ${plural(n, 'nauja', 'naujos', 'naujų')}`;
const watchKey = q => normalize(q);
const findWatch = q => WATCH.find(w => watchKey(w.q) === watchKey(q));
function watchHits(w) {
  const t = today(), words = normalize(w.q).split(' ');
  const hits = matchItems(DATA.items.filter(it => !it.t || it.t >= t), w.q);
  // pirmiau prekės, kuriose žodis yra toks pat, kaip įvestas („pienas“), po jų kitos formos
  // („kondensuoto pieno“ desertas, „prie kavos“ sausainiai); kiekvienoje grupėje – pigiausios pirmos
  for (const it of hits) it.y = words.every(x => it.w.includes(x)) ? 0 : 1;
  return hits.slice().sort((a, b) => a.x - b.x || a.y - b.y);
}
async function loadWatch() {
  const saved = await kv.get('watch');
  WATCH = Array.isArray(saved) ? saved : [];
  updateWatchCount();
}
function saveWatch() { kv.put('watch', WATCH); updateWatchCount(); }
function updateWatchCount() {
  // skaičius prie skilties: kiek stebimų prekių turi naujų akcijų
  const n = WATCH.filter(w => watchHits(w).some(it => !w.seen.includes(itemId(it)))).length, c = $('watchCount');
  c.hidden = !n; c.textContent = n;
}
function addWatch(q) {
  q = q.trim().replace(/\s+/g, ' ');
  if (!watchKey(q) || findWatch(q)) return false;
  const w = { q, at: Date.now(), seen: [] };
  w.seen = watchHits(w).map(itemId);   // esamos akcijos nėra „naujos“
  WATCH.push(w);
  saveWatch();
  return true;
}
function removeWatch(q) { WATCH = WATCH.filter(w => watchKey(w.q) !== watchKey(q)); saveWatch(); }
function watchToggle(q, cls) {
  const on = !!findWatch(q);
  const b = el('button', cls, on ? '★ Stebima' : `☆ Stebėti „${q}“`);
  if (cls === 'wbtn') b.textContent = on ? '★ Stebima' : '☆ Stebėti';
  b.type = 'button';
  b.title = on ? 'Paspauskite, kad nebestebėtumėte' : 'Rodyti šios prekės akcijas skiltyje „Stebimos“';
  b.onclick = () => { on ? removeWatch(q) : addWatch(q); load(); };
  return b;
}

function watchRow(it, isNew) {
  const r = el('div', 'wrow');
  r.style.setProperty('--c', chainColor(it.c));
  const a = el(it.l ? 'a' : 'div', 'wlink');
  if (it.l) { a.href = it.l; a.target = '_blank'; a.rel = 'noopener'; }
  const info = el('div', 'wi'), sub = el('div', 'wsub');
  sub.append(el('span', null, [CHAINS[it.c] || it.c, it.q, it.k].filter(Boolean).join(' · ')));
  if (isNew) sub.append(el('span', 'new', 'nauja'));
  const wt = whenTag(it); if (wt) sub.append(wt);
  info.append(el('div', 'wn', dispName(it.n)), sub);
  const pr = el('div', 'wpr');
  pr.append(el('span', 'wp', it.p != null ? eur(it.p) + ' €' : (it.d ? '' : '—')));
  if (it.d) pr.append(el('span', 'badge', '−' + it.d + '%'));
  a.append(el('span', 'dot'), info, pr);
  const b = el('button', 'slot wcart'); b.type = 'button';
  const paint = () => {
    const on = inBasket(it);
    b.classList.toggle('on', on); b.innerHTML = on ? ICON.inb : ICON.add;
    b.setAttribute('aria-label', (on ? 'Išimti iš krepšelio: ' : 'Įdėti į krepšelį: ') + it.n);
  };
  b.onclick = () => { toggleBasket(it); paint(); };
  paint();
  r.append(a, b);
  return r;
}

const SUGGEST = ['pienas', 'kiaušiniai', 'sviestas', 'kava', 'bananai', 'sūris'];
function renderWatch() {
  const v = $('watchView');
  v.replaceChildren();
  const form = el('form', 'wadd');
  const inp = el('input'); inp.type = 'text'; inp.placeholder = 'Pridėti prekę, pvz. sūris';
  inp.enterKeyHint = 'done'; inp.autocomplete = 'off'; inp.setAttribute('aria-label', 'Stebima prekė');
  const add = el('button', 'iconbtn'); add.type = 'submit'; add.setAttribute('aria-label', 'Pridėti');
  add.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  form.append(inp, add);
  form.onsubmit = e => {
    e.preventDefault();
    if (addWatch(inp.value)) { renderWatch(); $('watchView').querySelector('.wadd input').focus(); }
    else if (inp.value.trim()) { inp.select(); }
  };
  v.append(form);

  if (!WATCH.length) {
    const box = el('div', 'empty');
    box.append(el('div', 'big', '⭐'), el('h2', null, 'Stebėkite savo prekes'),
      el('p', null, 'Įrašykite prekes, kurias perkate dažnai, ir čia matysite visas jų akcijas. Paieškoje tą patį daro mygtukas „☆ Stebėti“.'));
    const sg = el('div', 'sugg');
    for (const q of SUGGEST) {
      const b = el('button', 'chip', '+ ' + q); b.type = 'button';
      b.onclick = () => { addWatch(q); renderWatch(); };
      sg.append(b);
    }
    box.append(sg);
    v.append(box);
    return;
  }

  // prekės su akcijomis viršuje (pridėjimo tvarka), be akcijų – apačioje
  const groups = WATCH.map(w => ({ w, hits: watchHits(w) }));
  groups.sort((a, b) => (!a.hits.length) - (!b.hits.length) || a.w.at - b.w.at);
  const withHits = groups.filter(g => g.hits.length).length;
  v.append(el('div', 'wsum', `${withHits} iš ${WATCH.length} ${plural(WATCH.length, 'prekės', 'prekių', 'prekių')} turi akcijų`));
  const rc = recCard(); if (rc) v.append(rc);

  const list = el('div', 'wlist');
  for (const { w, hits } of groups) {
    const fresh = (NEWNOW && NEWNOW.get(watchKey(w.q))) || new Set();
    const g = el('section', 'wg' + (hits.length ? '' : ' none'));
    const h = el('div', 'wh');
    h.append(el('h3', null, w.q.charAt(0).toUpperCase() + w.q.slice(1)));
    const nNew = hits.filter(it => fresh.has(itemId(it))).length;
    if (nNew) h.append(el('span', 'new', naujos(nNew)));
    const m = el('span', 'wm');
    if (hits.length) {
      const best = hits.some(it => !it.y) ? hits.filter(it => !it.y) : hits;   // „nuo“ – iš tiksliai atitinkančių
      const prices = best.map(it => it.p).filter(p => p != null);
      m.append(akcijos(hits.length));
      if (prices.length) { m.append(' · nuo '); m.append(el('b', null, eur(Math.min(...prices)) + ' €')); }
    }
    h.append(m);
    const x = el('button', 'wx'); x.type = 'button'; x.setAttribute('aria-label', 'Nebestebėti: ' + w.q);
    x.innerHTML = ICON.rm;
    x.onclick = () => {
      const prev = WATCH.slice();
      removeWatch(w.q); renderWatch();
      toast(`Nebestebima: ${w.q}`, () => { WATCH = prev; saveWatch(); if (state.view === 'watch') renderWatch(); });
    };
    h.append(x);
    g.append(h);
    if (!hits.length) g.append(el('div', 'wnone', 'Akcijų šiuo metu nėra'));
    // pirmiausia naujos, tada pigiausios; rodomos 3, kitos – sąraše
    const shown = hits.slice().sort((a, b) => fresh.has(itemId(b)) - fresh.has(itemId(a))).slice(0, 3);
    for (const it of shown) g.append(watchRow(it, fresh.has(itemId(it))));
    if (hits.length > 3) {
      const more = el('button', 'wmore', `Rodyti visas ${hits.length} →`); more.type = 'button';
      more.onclick = () => { state.q = w.q; state.chain = null; state.page = 1; q.value = w.q;
        $('searchBox').classList.add('has-text'); setView('list'); };
      g.append(more);
    }
    list.append(g);
  }
  v.append(list);
}

// atidarius skiltį: įsimenama, kas šįkart nauja, ir tai pažymima kaip matyta
function markWatchSeen() {
  NEWNOW = new Map();
  for (const w of WATCH) {
    const ids = watchHits(w).map(itemId);
    NEWNOW.set(watchKey(w.q), new Set(ids.filter(id => !w.seen.includes(id))));
    w.seen = ids;
  }
  saveWatch();
}

/* ---------- Kur apsipirkti: tinklas, kuriame daugiausia stebimų prekių su akcija ----------
   Žinomos tik akcijų kainos (ne įprastos), todėl lyginama, kiek stebimų prekių tinkle turi akciją, ir kiek sutaupoma. */
const byPrice = (a, b) => (a.p ?? Infinity) - (b.p ?? Infinity);
const savingOf = it => (it && it.o > it.p ? it.o - it.p : 0);
function recommend() {
  // „Šią savaitę“: tik jau galiojančios akcijos; kitos savaitės („nuo 11.23“) – tik paminimos prie „Be akcijos“
  const t0 = today(), soon = new Map();
  const terms = WATCH.map(w => {
    const all = watchHits(w), hits = all.filter(h => !h.f || h.f <= t0);
    const later = all.filter(h => h.f && h.f > t0).map(h => h.f).sort()[0];
    if (!hits.length && later) soon.set(w.q, later);
    return { q: w.q, rel: hits.some(h => !h.y) ? hits.filter(h => !h.y) : hits };   // tik tiksliai atitinkančios
  }).filter(t => t.rel.length);
  if (!terms.length) return null;
  const chains = Object.keys(CHAINS).map(c => {
    const pick = new Map();
    for (const t of terms) { const it = t.rel.filter(h => h.c === c).sort(byPrice)[0]; if (it) pick.set(t.q, it); }
    let save = 0; for (const it of pick.values()) save += savingOf(it);
    return { c, pick, n: pick.size, save };
  }).filter(x => x.n).sort((a, b) => b.n - a.n || b.save - a.save);
  const best = chains[0];
  // dvi parduotuvės: rodoma, tik jei kartu apima daugiau prekių nei geriausia viena
  let combo = null;
  for (let i = 0; i < chains.length; i++) for (let j = i + 1; j < chains.length; j++) {
    const A = chains[i], B = chains[j], pick = new Map();
    for (const t of terms) {
      const a = A.pick.get(t.q), b = B.pick.get(t.q);
      const it = a && b ? (byPrice(a, b) <= 0 ? a : b) : a || b;
      if (it) pick.set(t.q, it);
    }
    let save = 0; for (const it of pick.values()) save += savingOf(it);
    if (pick.size > best.n && (!combo || pick.size > combo.n || (pick.size === combo.n && save > combo.save)))
      combo = { a: A.c, b: B.c, pick, n: pick.size, save };
  }
  return { chains, best, combo, soon };
}

/* ---------- Artimiausia parduotuvė: parduotuves.json (fetch/parduotuves.py, OpenStreetMap) ----------
   Vieta nustatoma tik paspaudus ir lieka telefone. Atstumas pėsčiomis apytikslis: tiesi linija × 1,3, 5 km/h. */
let STORES = null, LOC = null, LOCERR = '';
async function loadStores() {
  try {
    const r = await fetch('parduotuves.json', { cache: 'no-cache' });
    if (r.ok) STORES = ((await r.json()).stores || []).filter(st => !/uždaryt|closed/i.test(st.n));   // uždarytos nerodomos
  } catch {}
  LOC = (await kv.get('loc')) || null;
}
function locate() {
  return new Promise(ok => {
    if (!window.isSecureContext) { LOCERR = 'Vietą galima nustatyti tik atidarius svetainę per https:// adresą.'; return ok(null); }
    if (!navigator.geolocation) { LOCERR = 'Šis telefonas vietos nustatyti neleidžia.'; return ok(null); }
    const done = p => {
      LOC = { lat: p.coords.latitude, lon: p.coords.longitude, at: Date.now() }; LOCERR = '';
      kv.put('loc', LOC); ok(LOC);
    };
    // pirmiausia greitai (Wi-Fi / tinklas); nepavykus – dar kartą su GPS ir ilgesniu laukimu
    const fail = (e, retry) => {
      if (e.code !== 1 && retry)
        return navigator.geolocation.getCurrentPosition(done, e2 => fail(e2, false), { enableHighAccuracy: true, timeout: 20000, maximumAge: 600000 });
      LOCERR = e.code === 1 ? 'Vietos naudoti neleista. Leiskite tai naršyklės nustatymuose arba pasirinkite miestą.'
             : 'Vietos nustatyti nepavyko – įjunkite vietos nustatymą (GPS) telefone arba pasirinkite miestą.';
      ok(null);
    };
    navigator.geolocation.getCurrentPosition(done, e => fail(e, true), { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
  });
}
// atsarginis būdas be vietos nustatymo: miestas iš parduotuvių adresų, vieta – jo parduotuvių vidurkis
function cities() {
  const m = new Map();
  for (const s of STORES || []) {
    const city = (s.a || '').split(',').pop().trim();
    if (!city || /\d/.test(city)) continue;
    const c = m.get(city) || { n: 0, lat: 0, lon: 0 }; c.n++; c.lat += s.lat; c.lon += s.lon; m.set(city, c);
  }
  return [...m].filter(([, c]) => c.n >= 2).map(([name, c]) => ({ name, n: c.n, lat: c.lat / c.n, lon: c.lon / c.n }))
    .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'lt'));
}
function cityPicker(rerender) {
  const sel = el('select', 'near-city'); sel.setAttribute('aria-label', 'Pasirinkti miestą');
  sel.append(new Option('… arba pasirinkite miestą', ''));
  for (const c of cities()) sel.append(new Option(c.name, c.name));
  sel.onchange = () => {
    const c = cities().find(x => x.name === sel.value); if (!c) return;
    LOC = { lat: c.lat, lon: c.lon, at: Date.now(), city: c.name }; LOCERR = ''; kv.put('loc', LOC); rerender();
  };
  return sel;
}
// jei leidimas jau duotas ir vieta senesnė nei 10 min. – atnaujinama tyliai
async function refreshLoc(after) {
  if (!STORES || !LOC || LOC.city || Date.now() - LOC.at < 6e5) return;
  try { const st = await navigator.permissions.query({ name: 'geolocation' }); if (st.state !== 'granted') return; } catch { return; }
  if (await locate()) after();
}
// OpenStreetMap pavadinimai nevienodi („Iki“, „RIMI Hypermarket“, „Maxima x“) – rodomi vienodai
const CHAIN_NAME = { maxima: 'Maxima', iki: 'IKI', lidl: 'Lidl', rimi: 'Rimi', norfa: 'Norfa' };
function storeName(st) {
  return st.n.replace(/^(maxima|iki|lidl|rimi|norfa)(?=\s|$)/i, CHAIN_NAME[st.c] || '$1')
    .replace(/(\s)hypermarket(?=\s|$)/i, '$1Hyper')
    .replace(/(\s)(x{1,3}|xl|xxl|l|s)(?=\s|$)/i, (m, sp, f) => sp + f.toUpperCase())
    .replace(/(\s)(express|ekspres|cento|mini|super|hyper|bazė)(?=\s|$)/gi, (m, sp, w) => sp + w[0].toUpperCase() + w.slice(1).toLowerCase());
}
// didelių formatų (XL, Hyper ir pan.) parduotuvė niekada nelaikoma maža, net jei taip pažymėta OpenStreetMap
const BIG_FMT = /(^|\s)(xl|xxl|xx|xxx|l|hyper|hypermarket|super|bazė)(?=\s|$)/iu;
const isSmall = st => !!st.s && !BIG_FMT.test(st.n);
function distKm(a, b) {
  const k = Math.cos(a.lat * Math.PI / 180) * 111.32;
  return Math.hypot((a.lat - b.lat) * 110.54, (a.lon - b.lon) * k);
}
function nearest(chain) {
  if (!STORES || !LOC) return null;
  let big = null, small = null;
  for (const s of STORES) {
    if (s.c !== chain) continue;
    const d = distKm(LOC, s) * 1.3;
    if (isSmall(s)) { if (!small || d < small.d) small = { s, d }; }
    else if (!big || d < big.d) big = { s, d };
  }
  return { big: big || small, small: big && small && small.d < big.d ? small : null };
}
const fmtKm = km => km < 1 ? `~${Math.max(50, Math.round(km * 20) * 50)} m` : `~${km < 10 ? km.toFixed(1).replace('.', ',') : Math.round(km)} km`;
const fmtWalk = km => { if (km > 6) return fmtKm(km); const m = Math.max(1, Math.round(km / 5 * 60)); return `${fmtKm(km)} · ~${m} min pėsčiomis`; };
const mapsUrl = s => `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=walking`;

function nearLink(n, cls = 'near') {
  const a = el('a', cls); a.href = mapsUrl(n.s); a.target = '_blank'; a.rel = 'noopener';
  a.setAttribute('aria-label', `Atidaryti žemėlapyje: ${storeName(n.s)}${n.s.a ? ', ' + n.s.a : ''}`);
  const i = el('span', 'ni', storeName(n.s) + (n.s.a ? ', ' + n.s.a : ''));
  i.append(el('small', null, (LOC && LOC.city ? `${LOC.city}, nuo centro ${fmtKm(n.d)}` : fmtWalk(n.d)) + (isSmall(n.s) ? ' · mažesnė parduotuvė' : '')));
  a.append(el('span', 'pin', '📍'), i, el('span', 'go', 'Žemėlapis ›'));
  return a;
}
// artimiausios parduotuvės eilutė(s) tinklui; be vietos – mygtukas „Rasti artimiausią“
function storeLines(c, rerender) {
  const out = [];
  if (!STORES) return out;
  if (!LOC) {
    const b = el('button', 'near'); b.type = 'button';
    const i = el('span', 'ni', `Rasti artimiausią ${CHAINS[c]}`);
    i.append(el('small', null, LOCERR || 'Vieta naudojama tik šiame telefone ir niekur nesiunčiama'));
    b.append(el('span', 'pin', '📍'), i, el('span', 'go', '›'));
    b.onclick = async () => { b.disabled = true; b.querySelector('small').textContent = 'Nustatoma vieta…'; await locate(); rerender(); };
    out.push(b);
    if (LOCERR) out.push(cityPicker(rerender));
    return out;
  }
  const n = nearest(c);
  if (!n || !n.big) return out;
  out.push(nearLink(n.big));
  if (n.small) {   // arčiau esanti maža parduotuvė – viena kukli eilutė
    const sm = el('a', 'near small'); sm.href = mapsUrl(n.small.s); sm.target = '_blank'; sm.rel = 'noopener';
    sm.append(el('span', 'ni', `Arčiau: ${storeName(n.small.s)} · ${fmtKm(n.small.d)} – maža, akcijų gali nebūti`), el('span', 'go', '›'));
    out.push(sm);
  }
  return out;
}

let cmpOpen = false, recOpen = false;
// sutaupymas žinomas tik ten, kur leidinyje yra sena kaina (Lidl jos dažnai nenurodo):
// kai žinoma mažiau nei pusei prekių – suma nerodoma, kai ne visoms – „bent ~X €“
function saveText(pick, save) {
  const n = pick.size, k = [...pick.values()].filter(it => it.o != null && it.p != null).length;
  if (!(save > 0) || k * 2 < n) return '';
  return (k < n ? 'bent ~' : '~') + eur(save) + ' €';
}
function recCard() {
  const r = recommend();
  if (!r) return null;
  const { best, combo, chains, soon } = r, N = WATCH.length;
  const box = el('section', 'rec'); box.style.setProperty('--c', chainColor(best.c));
  // suskleista – viena eilutė (kad matytųsi pačios stebimos prekės); paspaudus – visa informacija
  const head = el('button', 'rec-head'); head.type = 'button'; head.setAttribute('aria-expanded', String(recOpen));
  head.onclick = () => { recOpen = !recOpen; renderWatch(); };
  const main = el('div', 'rec-main');
  const st = el('span', 'store'); st.append(el('span', 'dot'), CHAINS[best.c]);
  main.append(st, el('span', 'cov', `${best.n} iš ${N}`));
  const bs = saveText(best.pick, best.save); if (bs) main.append(el('span', 'save', bs));
  const nb = LOC && STORES && nearest(best.c);
  if (nb && nb.big) main.append(el('span', 'dist', '📍 ' + (LOC.city || fmtKm(nb.big.d))));
  const lbl = el('div', 'rec-l', 'Šią savaitę geriausia');
  const txt = el('div', 'rec-ht'); txt.append(lbl, main);
  head.append(txt, el('span', 'chev', recOpen ? '▴' : '▾'));
  box.append(head);
  if (!recOpen) { box.classList.add('closed'); return box; }
  const sub = el('div', 'rec-sub');
  sub.append('Su akcija: ', el('b', null, [...best.pick.keys()].join(', ')));
  const miss = WATCH.map(w => w.q).filter(q => !best.pick.has(q));
  if (miss.length) sub.append(el('br'), 'Be akcijos: ' + miss.map(q => soon.has(q) ? `${q} (akcija nuo ${fmtDate(soon.get(q))})` : q).join(', '));
  box.append(sub, ...storeLines(best.c, renderWatch));

  if (combo) {
    const cb = el('div', 'rec-combo');
    const inA = [...combo.pick].filter(([, it]) => it.c === combo.a).map(([q]) => q);
    const inB = [...combo.pick].filter(([, it]) => it.c === combo.b).map(([q]) => q);
    cb.append('Arba dvi parduotuvės: ', el('b', null, `${CHAINS[combo.a]} + ${CHAINS[combo.b]}`),
      ` – ${combo.n} iš ${N}` + (saveText(combo.pick, combo.save) ? `, sutaupote ${saveText(combo.pick, combo.save)}` : ''));
    const d = el('div', 'rec-sub');
    d.append(`${CHAINS[combo.a]}: ${inA.join(', ')}`, el('br'), `${CHAINS[combo.b]}: ${inB.join(', ')}`);
    cb.append(d);
    box.append(cb);
  }

  if (chains.length > 1) {
    const more = el('button', 'rec-more', cmpOpen ? 'Slėpti palyginimą ▴' : `Palyginti visus tinklus (${chains.length}) ▾`);
    more.type = 'button'; more.setAttribute('aria-expanded', String(cmpOpen));
    more.onclick = () => { cmpOpen = !cmpOpen; renderWatch(); };
    box.append(more);
    if (cmpOpen) {
      const cmp = el('div', 'cmp');
      for (const ch of chains) {
        const row = el('div', 'cmp-row'); row.style.setProperty('--c', chainColor(ch.c));
        const top = el('div', 'top');
        const s2 = el('span', 'store'); s2.append(el('span', 'dot'), CHAINS[ch.c]);
        top.append(s2, el('span', 'cn', `${ch.n} iš ${N}` + (saveText(ch.pick, ch.save) ? ` · ${saveText(ch.pick, ch.save)}` : '')));
        row.append(top, el('div', 'rec-sub', [...ch.pick].map(([q, it]) => `${q} ${it.p != null ? eur(it.p) + ' €' : '−' + it.d + '%'}`).join(' · ')));
        if (LOC && STORES) { const n = nearest(ch.c); if (n && n.big) row.append(nearLink(n.big)); }
        cmp.append(row);
      }
      box.append(cmp);
    }
  }
  if (STORES && LOC) {
    const ch = el('button', 'near-change', LOC.city ? `Miestas: ${LOC.city} · keisti` : 'Keisti vietą'); ch.type = 'button';
    ch.onclick = async () => { LOC = null; LOCERR = ''; await kv.put('loc'); renderWatch(); };
    box.append(ch);
  }
  if (STORES) box.append(el('div', 'osm', 'Parduotuvių vietos: © OpenStreetMap bendraautoriai · atstumas apytikslis'));
  return box;
}

/* ---------- Krepšelyje ekranas neužgęsta (kol skiltis atidaryta ir yra ką pirkti) ---------- */
let wakeLock = null;
async function updateWake() {
  const want = state.view === 'basket' && document.visibilityState === 'visible' && BASKET.some(b => !b.done);
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; const n = $('wakeNote'); if (n) n.hidden = true; });
    } else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
  const n = $('wakeNote'); if (n) n.hidden = !wakeLock;
}
document.addEventListener('visibilitychange', updateWake);

const TITLES = { list: 'Akcijos', watch: 'Stebimos', basket: 'Krepšelis' };
async function setView(v) {
  state.view = v;
  kv.put('view', v);   // kitą kartą atsidarys ta pati skiltis
  document.body.classList.toggle('v-basket', v === 'basket');
  document.body.classList.toggle('v-watch', v === 'watch');
  document.querySelector('.brand h1').textContent = TITLES[v];
  for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.view === v));
  statusEl.hidden = resultsEl.hidden = pagerEl.hidden = v !== 'list';
  $('basketView').hidden = v !== 'basket';
  $('watchView').hidden = v !== 'watch';
  if (v === 'list' || !DATA) await load();   // pirmą kartą užkrauna duomenis, krepšelį ir stebimas
  if (v === 'basket') { syncUrl(); renderBasket(); refreshLoc(() => state.view === 'basket' && renderBasket()); }
  if (v === 'watch') { syncUrl(); if (DATA) { markWatchSeen(); renderWatch(); refreshLoc(() => state.view === 'watch' && renderWatch()); } }
  window.scrollTo(0, 0);
  updateWake();
}

/* ---------- „Rodyti daugiau“ (vietoj puslapių numerių: telefone patogiau) ---------- */
function renderMore(data) {
  pagerEl.replaceChildren();
  const left = data.total - data.results.length;
  if (left <= 0) return;
  const b = el('button', 'chip more', `Rodyti daugiau · liko ${left}`); b.type = 'button';
  b.onclick = () => { state.page++; load(true); };
  pagerEl.append(b);
}

/* ---------- Užkrovimas ---------- */
function syncUrl() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.chain) p.set('chain', state.chain);
  if (state.sort) p.set('sort', state.sort);
  if (state.all) p.set('all', '1');
  if (state.page > 1) p.set('page', state.page);
  if (state.view !== 'list') p.set('view', state.view === 'basket' ? 'krepselis' : 'stebimos');
  const qs = p.toString();
  try { history.replaceState(null, '', qs ? '?' + qs : location.pathname); } catch {}
}

async function load(more = false) {
  syncUrl();
  for (const x of $('sort').children) x.setAttribute('aria-pressed', String(x.dataset.sort === sortMode()));
  $('filtersBadge').hidden = !state.sort && !state.all;
  if (!DATA) {
    statusEl.textContent = 'Kraunama…';
    resultsEl.replaceChildren(...[0, 1, 2, 3].map(() => el('div', 'skel')));
    try {
      await loadData();
      await loadBasket();
      await loadWatch();
      await loadStores();
    } catch (e) {
      statusEl.textContent = '';
      const box = el('div', 'empty');
      box.append(el('div', 'big', '📡'), el('h2', null, 'Nepavyko įkelti akcijų'),
        el('p', null, 'Patikrinkite interneto ryšį ir bandykite dar kartą.'));
      const b = el('button', 'chip', 'Bandyti dar kartą'); b.type = 'button'; b.onclick = load;
      box.append(b);
      resultsEl.replaceChildren(box);
      return;
    }
  }
  const data = browse();
  state.page = data.page;
  syncUrl();
  lastCounts = data.counts;
  renderChains(data.counts);
  $('sheetDone').textContent = data.total ? `Rodyti ${data.total} ${prekes(data.total)}` : 'Uždaryti';
  if (!data.total) {
    statusEl.textContent = '';
    pagerEl.replaceChildren();
    const box = el('div', 'empty');
    box.append(el('div', 'big', '🔍'), el('h2', null, 'Nieko neradome'),
      el('p', null, state.q ? `Pagal „${state.q}“ akcijų nėra. Pabandykite trumpesnį ar kitą žodį.` : 'Šiuo metu akcijų nėra.'));
    if (state.q && !state.chain) box.append(watchToggle(state.q, 'chip'));
    if (state.chain) {
      const b = el('button', 'chip', 'Ieškoti visose parduotuvėse'); b.type = 'button';
      b.onclick = () => { state.chain = null; state.page = 1; load(); };
      box.append(b);
    }
    resultsEl.replaceChildren(box);
    return;
  }
  statusEl.replaceChildren(`${data.total} ${prekes(data.total)}` + (sortMode() === 'discount' ? ' · didžiausios nuolaidos pirmos' : ''));
  if (state.q) statusEl.append(watchToggle(state.q, 'wbtn'));
  const shown = resultsEl.querySelectorAll('.cardbox').length;
  if (more && shown) resultsEl.append(...data.results.slice(shown).map(listCard));   // tik naujos kortelės
  else resultsEl.replaceChildren(...data.results.map(listCard));
  renderMore(data);
}

function onInput(now = false) {
  $('searchBox').classList.toggle('has-text', !!q.value);
  clearTimeout(timer);
  timer = setTimeout(() => {
    const text = q.value.trim();
    if (text === state.q) return;
    state.q = text; state.page = 1; load();
  }, now ? 0 : 250);
}

q.addEventListener('input', () => onInput());
q.addEventListener('keydown', e => { if (e.key === 'Enter') { q.blur(); onInput(true); } });
$('clear').onclick = () => { q.value = ''; q.focus(); onInput(true); };
allBox.addEventListener('change', () => { state.all = allBox.checked; state.page = 1; load(); });
$('sort').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.sort === sortMode()) return;
  state.sort = b.dataset.sort; state.page = 1; load();
});

$('chains').addEventListener('scroll', updateFade, { passive: true });
addEventListener('resize', updateFade);
const sheet = $('sheet');
$('filtersBtn').onclick = () => sheet.showModal();
$('logoutBtn').onclick = async () => { await kv.put('login'); location.reload(); };
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });   // paspaudus šalia lapo
// šešėlis po antrašte, kai ji „prilimpa“ viršuje
new IntersectionObserver(([e]) => document.querySelector('header').classList.toggle('stuck', !e.isIntersecting))
  .observe(document.querySelector('.brand'));

q.value = state.q;
allBox.checked = state.all;
$('searchBox').classList.toggle('has-text', !!q.value);
if (matchMedia('(min-width: 700px)').matches && state.view === 'list') q.focus();
for (const t of document.querySelectorAll('.tab')) t.onclick = () => { if (t.dataset.view !== state.view) setView(t.dataset.view); };
// be nuorodos parametrų atsidaro paskutinė naudota skiltis
(async () => {
  if (!params.get('view') && !params.get('q') && !params.get('chain')) {
    const last = await kv.get('view');
    if (last && last in TITLES) state.view = last;
  }
  setView(state.view);
})();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
